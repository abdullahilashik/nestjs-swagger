services:
  nginx:
    image: nginx:latest
    container_name: nginx_container_name
    volumes:
      - ./www:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    # depends_on:
    #   - php
    ports:
      - "8080:80"
    networks:
      - lempnet

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./www:/var/www/html
    networks:
      - lempnet

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: exampledb
      MYSQL_USER: user
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - lempnet    

  adminer:
    image: adminer
    restart: always
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    networks:
      - lempnet

volumes:
  mysql-data:

networks:
  lempnet: