services:
  control-node:
    image: ubuntu:22.04
    container_name: ansible-controller
    command: /bin/sh -c "apt-get update && apt-get install -y ansible sshpass git && tail -f /dev/null"
    volumes:
      - ./playbooks:/playbooks
    working_dir: /playbooks
    networks:
      - ansible-net

  target-1:
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    container_name: ansible-target-1
    # Geerlingguy images use systemd, so we expose port 22 or let docker map it
    ports:
      - "2222:22"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroup: host
    networks:
      - ansible-net

  target-2:
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    container_name: ansible-target-2
    ports:
      - "2223:22"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroup: host
    networks:
      - ansible-net


networks:
  ansible-net:
    driver: bridge