---
- name: Install and Start Apache2 on Ubuntu
  hosts: webservers
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Apache2 (latest version)
      apt:
        name: apache2
        state: latest

    - name: Ensure Apache2 is running and enabled
      service:
        name: apache2
        state: started
        enabled: yes