services:
  jenkins:
    image: jenkins/jenkins
    container_name: jenkins_container
    restart: always
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - $PWD/jenkins_home:/var/jenkins_home
      - //./pipe/docker_engine://./pipe/docker_engine
    networks:
      - net

networks:
  net: